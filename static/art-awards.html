<head>
<meta charset="UTF-8">

<title>Art Awards Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--border:rgba(255,255,255,0.07);--text:#e8e8ef;--muted:#888898;--faint:#444458;--s-bg:#1a1400;--s-text:#FFD700;--s-border:#8a7000;--a-bg:#180808;--a-text:#ff7575;--a-border:#8a2020;--b-bg:#081418;--b-text:#4ecdc4;--b-border:#1a5a58;--c-bg:#0f0818;--c-text:#b89fd8;--c-border:#4a3568;--d-bg:#111111;--d-text:#777;--d-border:#333}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh}
  header{border-bottom:1px solid var(--border);padding:2.5rem 2rem 1.5rem;max-width:1200px;margin:0 auto}
  .site-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.4rem}
  h1{font-family:'DM Serif Display',serif;font-size:clamp(28px,5vw,48px);font-weight:400;line-height:1.1}
  .subtitle{font-size:13px;color:var(--muted);margin-top:.5rem}
  .controls{max-width:1200px;margin:0 auto;padding:1.2rem 2rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.8rem}
  .controls-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .tab{padding:5px 11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.5px;cursor:pointer;border-radius:2px;transition:all .15s}
  .tab:hover{border-color:var(--faint);color:var(--text)}
  .tab.active{background:var(--surface2);border-color:var(--faint);color:var(--text)}
  .tier-btn{padding:5px 11px;border:1px solid transparent;background:transparent;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;cursor:pointer;border-radius:2px;transition:all .15s;letter-spacing:1px}
  .tier-btn[data-tier="S"]{color:var(--s-text);border-color:var(--s-border)}
  .tier-btn[data-tier="A"]{color:var(--a-text);border-color:var(--a-border)}
  .tier-btn[data-tier="B"]{color:var(--b-text);border-color:var(--b-border)}
  .tier-btn[data-tier="C"]{color:var(--c-text);border-color:var(--c-border)}
  .tier-btn[data-tier="D"]{color:var(--d-text);border-color:var(--d-border)}
  .tier-btn.dimmed{opacity:.22}
  .search-wrap{position:relative;margin-left:auto}
  .search-wrap input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:6px 12px 6px 28px;border-radius:2px;width:200px;outline:none}
  .search-wrap input::placeholder{color:var(--faint)}
  .search-wrap input:focus{border-color:var(--faint)}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:12px;pointer-events:none}
  .stats-bar{max-width:1200px;margin:0 auto;padding:.8rem 2rem;display:flex;gap:2rem;font-family:'DM Mono',monospace;font-size:10px;color:var(--faint);border-bottom:1px solid var(--border)}
  .stats-bar span{color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding:2rem}
  .tier-section{margin-bottom:2.5rem}
  .tier-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
  .tier-badge{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid;border-radius:3px;flex-shrink:0}
  .tier-badge.S{color:var(--s-text);border-color:var(--s-border);background:var(--s-bg)}
  .tier-badge.A{color:var(--a-text);border-color:var(--a-border);background:var(--a-bg)}
  .tier-badge.B{color:var(--b-text);border-color:var(--b-border);background:var(--b-bg)}
  .tier-badge.C{color:var(--c-text);border-color:var(--c-border);background:var(--c-bg)}
  .tier-badge.D{color:var(--d-text);border-color:var(--d-border);background:var(--d-bg)}
  .tier-desc{font-size:12px;color:var(--muted)}
  .tier-desc strong{color:var(--text);font-weight:500}
  .awards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
  .award-card{background:var(--surface);padding:1.1rem 1.3rem;transition:background .12s}
  .award-card:hover{background:var(--surface2)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:5px}
  .award-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
  .award-rank{font-family:'DM Mono',monospace;font-size:10px;color:var(--faint);flex-shrink:0;padding-top:2px}
  .award-org{font-size:11px;color:var(--muted);margin-bottom:8px}
  .card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .meta-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.5px;padding:2px 6px;border:1px solid var(--border);border-radius:2px;color:var(--muted)}
  .award-notes{font-size:11px;color:var(--faint);line-height:1.5;font-style:italic}
  .no-results{padding:3rem 2rem;text-align:center;color:var(--muted);font-size:13px}
  .divider{width:1px;height:14px;background:var(--border)}
  footer{border-top:1px solid var(--border);max-width:1200px;margin:2rem auto 0;padding:1.5rem 2rem;font-size:11px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  @media(max-width:640px){header,.controls,main,.stats-bar,footer{padding-left:1rem;padding-right:1rem}.awards-grid{grid-template-columns:1fr}.search-wrap{margin-left:0}.search-wrap input{width:100%}}
</style>
</head>

      <button class="tier-btn" data-tier="C">C</button>

    </div>
    <div class="search-wrap">

    </div>
  </div>
</div>

<div class="stats-bar">
  <div>SHOWING <span id="statCount">0</span> AWARDS</div>
  <div>ACROSS <span id="statDomains">0</span> DOMAINS</div>
</div>

<main id="mainContent"></main>

<footer>
  <span>Art Awards Ranking · 2025</span>
  <span>Rankings based on global reach, jury independence, longevity &amp; cultural impact</span>
</footer>

const TIERS=['S','A','B','C','D'];
const TL={S:'<strong>Global flagship</strong> — undisputed international prestige',A:'<strong>Major</strong> — strong industry weight, peer or critic recognition',B:'<strong>Significant</strong> — national/regional or specialized prestige',C:'<strong>Notable</strong> — genre, niche, or popular audience focus',D:'<strong>Minor</strong> — limited curatorial rigor or narrow reach'};

let activeDomain='all', activeTiers=new Set(TIERS), searchQuery='';

function getFiltered(){
  const pool=activeDomain==='all'?Object.entries(DATA).flatMap(([d,a])=>a.map(x=>({...x,domain:d}))):(DATA[activeDomain]||[]).map(x=>({...x,domain:activeDomain}));
  return pool.filter(a=>{
    if(!activeTiers.has(a.tier))return false;
    if(searchQuery){const q=searchQuery.toLowerCase();return a.name.toLowerCase().includes(q)||a.org.toLowerCase().includes(q)||a.region.toLowerCase().includes(q)||a.domain.toLowerCase().includes(q);}
    return true;
  });
}

function render(){
  const filtered=getFiltered();
  const byTier={};TIERS.forEach(t=>byTier[t]=[]);
  filtered.forEach(a=>byTier[a.tier].push(a));

  const ranks={};
  Object.entries(DATA).forEach(([domain,awards])=>{
    [...awards].sort((x,y)=>TIERS.indexOf(x.tier)-TIERS.indexOf(y.tier)).forEach((a,i)=>{ranks[domain+'::'+a.name]=i+1;});
  });

  let html='',total=0;const ds=new Set();
  TIERS.forEach(tier=>{
    const awards=byTier[tier];if(!awards.length)return;
    total+=awards.length;awards.forEach(a=>ds.add(a.domain));
    html+=`<div class="tier-section"><div class="tier-header"><div class="tier-badge ${tier}">${tier}</div><div><div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px">Tier ${tier}</div><div class="tier-desc">${TL[tier]}</div></div></div><div class="awards-grid">`;
    awards.forEach(a=>{
      const rank=ranks[a.domain+'::'+a.name]||'—';
      const col=DC[a.domain]||'#888';
      html+=`<div class="award-card"><div class="card-top"><div class="award-name">${a.name}</div><div class="award-rank">#${rank}</div></div><div class="award-org">${a.org}</div><div class="card-meta"><span class="meta-tag" style="color:${col};border-color:${col}22">${a.domain}</span><span class="meta-tag">EST. ${a.since}</span><span class="meta-tag">${a.region}</span></div><div class="award-notes">${a.notes}</div></div>`;
    });
    html+=`</div></div>`;
  });
  if(!html)html=`<div class="no-results">No awards match your current filters.</div>`;
  document.getElementById('mainContent').innerHTML=html;
  document.getElementById('statCount').textContent=total;
  document.getElementById('statDomains').textContent=ds.size;
}

document.getElementById('domainTabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab');if(!tab)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');activeDomain=tab.dataset.domain;render();
});
document.getElementById('tierFilters').addEventListener('click',e=>{
  const btn=e.target.closest('.tier-btn');if(!btn)return;
  const tier=btn.dataset.tier;
  if(activeTiers.has(tier)){if(activeTiers.size===1)return;activeTiers.delete(tier);btn.classList.add('dimmed');}
  else{activeTiers.add(tier);btn.classList.remove('dimmed');}
  render();
});
document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value.trim();render();});
render();
</script>
